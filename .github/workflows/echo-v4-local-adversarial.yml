name: Echo V4 local adversarial regression
on:
  push:
    branches:
      - security/nonce1-authorization-preflight-2026-11
    paths:
      - 'scripts/inventory-groth16-artifacts.local.js'
      - 'contracts/test/EchoAtomicRollbackMocks.sol'
      - 'contracts/test/EchoV4RealRegistryRollbackFixtures.sol'
      - 'test/echo-v4-real-registry-atomic-rollback.stubbed-proof.local.js'
      - 'test/echo-v3-v4-real-groth16-negative-controls.local.js'
      - 'test/echo-v4-atomic-rollback.mock.local.js'
      - 'test/echo-v3-authenticated-checkpoint-replay.local.js'
      - 'test/echo-v4-real-registry-outsider-boundary.local.js'
      - 'test/echo-v4-repeated-unauthorized-fencing.local.js'
      - 'test/echo-v4-bridge-unauthorized-atomic.local.js'
      - 'test/echo-v4-local-proof-execution-registration-boundary.js'
      - 'test/echo-v4-bridge-bootstrap-fail-closed.local.js'
      - 'test/echo-v4-real-bridge-self-bootstrap-boundary.local.js'
      - 'contracts/test/EchoLocalExecutionMocks.sol'
      - 'test/echo-v4-bootstrap-registration.mock.local.js'
      - 'contracts/test/EchoSmartAccountV4BootstrapCandidate.sol'
      - 'contracts/security/EchoSmartAccountV4Bootstrap.sol'
      - 'contracts/test/EchoBootstrapVerifierMock.sol'
      - '.github/workflows/echo-v4-local-adversarial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Inventory proof artifacts without exposing key contents
        run: node scripts/inventory-groth16-artifacts.local.js
      - name: Run local-only Hardhat security regressions
        run: npx hardhat test --network hardhat test/echo-v4-repeated-unauthorized-fencing.local.js test/echo-v4-bridge-unauthorized-atomic.local.js test/echo-v4-atomic-rollback.mock.local.js test/echo-v3-authenticated-checkpoint-replay.local.js test/echo-v4-real-registry-outsider-boundary.local.js test/echo-v4-real-registry-atomic-rollback.stubbed-proof.local.js test/echo-v3-v4-real-groth16-negative-controls.local.js test/echo-v4-local-proof-execution-registration-boundary.js test/echo-v4-bridge-bootstrap-fail-closed.local.js test/echo-v4-real-bridge-self-bootstrap-boundary.local.js test/echo-v4-bootstrap-registration.mock.local.js
