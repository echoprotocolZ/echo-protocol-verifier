name: Echo V4 local-only security regression
on:
  push:
    branches:
      - security/nonce1-authorization-preflight-2026-11
    paths:
      - 'test/echo-v4-*.js'
      - 'circuits/v4/EchoBootstrapAuthorizationV1.circom'
      - 'scripts/test-v4-bootstrap-circuit.js'
      - 'scripts/test-v4-bootstrap-groth16-local.js'
      - 'contracts/**'
      - '.github/workflows/echo-v4-local-security.yml'
      - 'package*.json'
      - 'hardhat.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARDHAT_NETWORK: hardhat
      AMOY_RPC_URL: ''
      AMOY_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile bootstrap circuit and test witness constraints (no proof)
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/test-v4-bootstrap-circuit.js
      - name: Generate and verify ephemeral local Groth16 bootstrap proof
        timeout-minutes: 8
        run: timeout --signal=TERM --kill-after=10s 450s node scripts/test-v4-bootstrap-groth16-local.js
      - name: Run local-only V4 boundary and rollback regressions
        if: always()
        run: npx hardhat test test/echo-v4-local-proof-execution-registration-boundary.js test/echo-v4-registration-atomic-guardrails.js test/echo-v4-registration-intent-preview.js test/echo-v4-typed-bootstrap-intents.js test/echo-v4-bootstrap-proof-gate-boundary.js test/echo-v4-bootstrap-pair-factory.js --network hardhat
