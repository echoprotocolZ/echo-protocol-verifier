name: Echo positive Groth16 readiness gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  positive-proof-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Fail closed unless positive proof prerequisites exist
        run: node scripts/check-positive-groth16-prerequisites.local.js
      - name: Verify genuine positive V3 and V4 Groth16 proofs
        run: node scripts/verify-positive-groth16.local.js
      - name: Verify positive proofs on real Solidity verifiers (Hardhat local)
        run: npx hardhat test --network hardhat test/echo-v3-v4-solidity-positive-groth16.local.js
