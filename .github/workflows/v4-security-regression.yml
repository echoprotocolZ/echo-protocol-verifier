name: V4 Security Regression
on:
  push:
    branches:
      - security/v4-zero-trust-hardening
      - security/nonce1-authorization-preflight-2026-11
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: EGP-1 simulation
        run: node scripts/egp1-velocity-simulation.js
      - name: V4 security regressions
        run: npx hardhat test test/echo-v4-admin-intent.js test/echo-v4-account-admin-intent.js test/echo-v4-admin-self-call-block.js test/echo-v4-admin-fail-closed-invariants.js test/echo-v4-zero-trust-hardening.js test/echo-v4-two-step-ownership.js

  artifact-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: Install official Safe integration dependency
        run: npm install --no-save --package-lock=false --legacy-peer-deps @safe-global/safe-contracts@1.4.1
      - name: Generate V3 circuit metadata for public-signal tests
        run: node scripts/build-v3-test-artifacts.js
      - name: Audit artifact-independent test selection
        run: python3 scripts/audit-artifact-independent-coverage.py
      - name: Upload test selection inventory
        uses: actions/upload-artifact@v4
        with:
          name: artifact-independent-coverage
          path: artifact-independent-coverage.json
      - name: Run tests without external proving keys
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(python3 scripts/audit-artifact-independent-coverage.py --print-included)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No artifact-independent tests selected' >&2
            exit 1
          fi
          echo "Running ${#tests[@]} artifact-independent test files"
          npx hardhat test "${tests[@]}"

  v4-circuit-build:
    # Compiles the V4 geographic circuit without proving keys or trusted setup.
    # A successful build is NOT evidence of a valid Groth16 proof.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile V4 geographic circuit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v4-geographic-bound
          npx --no-install circom2 circuits/v4/EchoGeographicBoundV4.circom \
            --r1cs --sym --wasm -l node_modules -o build/v4-geographic-bound
          test -s build/v4-geographic-bound/EchoGeographicBoundV4.r1cs
          test -s build/v4-geographic-bound/EchoGeographicBoundV4_js/EchoGeographicBoundV4.wasm
          echo 'V4 circuit compile and WASM generation passed; no proof generated'
      - name: Verify V4 geographic witnesses and adversarial rejection
        run: node scripts/test-v4-geographic-witness-ci.js

  full-suite-diagnostic:
    # Secrets are unavailable to untrusted pull-request workflows.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/security/v4-zero-trust-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: Generate disposable V3 test artifacts
        run: node scripts/build-v3-test-artifacts.js
      - name: Compile V2 and V4 witness circuits
        shell: bash
        run: |
          mkdir -p build/v2 build/v4-geographic-bound
          npx --no-install circom2 EchoAuthorizationVerifierV2.circom --wasm -l node_modules -o build/v2
          npx --no-install circom2 circuits/v4/EchoGeographicBoundV4.circom --wasm -l node_modules -o build/v4-geographic-bound
      - name: Check decryption secret
        shell: bash
        env:
          ARTIFACT_KEY: ${{ secrets.ECHO_CI_ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo "Missing ECHO_CI_ARTIFACT_KEY"; exit 1; }
      - name: Decrypt original proof artifacts
        shell: bash
        env:
          ECHO_CI_ARTIFACT_KEY: ${{ secrets.ECHO_CI_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .ci/echo-ci-artifacts.tar.gz.enc \
            -pass env:ECHO_CI_ARTIFACT_KEY | tar -xz -f -
          test -f build/v2/verification_key.json
          test -f build/v3-timestamp-fixed/verification_key.json
          test -f build/v4-geographic-bound/verification_key.json
      - name: Run complete suite and preserve failures
        shell: bash
        run: |
          set -o pipefail
          npx hardhat test 2>&1 | tee full-hardhat-results.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-hardhat-results
          path: full-hardhat-results.log
          if-no-files-found: ignore

  trusted-real-proof-rollback:
    # Review-only on this PR. Secret-backed execution is permitted solely
    # for a manual dispatch on the established trusted security branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/security/v4-zero-trust-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: Generate disposable V3 circuit metadata
        run: node scripts/build-v3-test-artifacts.js
      - name: Compile V4 witness circuit
        run: |
          set -euo pipefail
          mkdir -p build/v4-geographic-bound
          npx --no-install circom2 circuits/v4/EchoGeographicBoundV4.circom --wasm -l node_modules -o build/v4-geographic-bound
      - name: Decrypt trusted proving artifacts
        shell: bash
        env:
          ECHO_CI_ARTIFACT_KEY: ${{ secrets.ECHO_CI_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          test -n "$ECHO_CI_ARTIFACT_KEY" || { echo 'Required proving artifact key unavailable' >&2; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -in .ci/echo-ci-artifacts.tar.gz.enc -pass env:ECHO_CI_ARTIFACT_KEY | tar -xz -f -
          test -s build/v3-timestamp-fixed/EchoAuthorizationVerifierV3_final.zkey
          test -s build/v3-timestamp-fixed/verification_key.json
          test -s build/v4-geographic-bound/setup/EchoGeographicBoundV4_final.zkey
          test -s build/v4-geographic-bound/setup/verification_key.json
      - name: Run real-proof atomic rollback and replay regressions
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test test/echo-v4-execution-atomic-rollback.js test/echo-v4-atomic-rollback-retry.js
