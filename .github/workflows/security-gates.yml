name: Echo Protocol Z security gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts
      - name: Guard signed checkpoint binding source invariants
        run: node scripts/check-checkpoint-binding-source.js
      - name: Compile from clean checkout
        run: npx hardhat compile
      - name: Run Hardhat regression suite
        run: npx hardhat test
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
  bound-circuit-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile hardened checkpoint-bound circuit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bound
          npx circom2 SpatiotemporalFragmentVerifierBound.circom --r1cs --wasm --sym -l node_modules -o build/bound
          test -s build/bound/SpatiotemporalFragmentVerifierBound.r1cs
          test -s build/bound/SpatiotemporalFragmentVerifierBound_js/SpatiotemporalFragmentVerifierBound.wasm
      - name: Run adversarial checkpoint witness regressions
        run: node scripts/test-bound-checkpoint-witness.js
      - name: Report circuit constraint count
        run: npx snarkjs r1cs info build/bound/SpatiotemporalFragmentVerifierBound.r1cs
  groth16-artifact-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Locate and verify tracked Groth16 zkeys
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' keys < <(find . -type f -name '*.zkey' -not -path './node_modules/*' -print0)
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "::error::No .zkey files tracked in this checkout. Trusted-setup integrity remains UNVERIFIED; supply the intended artifacts and matching .ptau for verification."
            exit 1
          fi
          mapfile -d '' ptaus < <(find . -type f -name '*.ptau' -not -path './node_modules/*' -print0)
          if [ "${#ptaus[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one reviewed .ptau artifact; found ${#ptaus[@]}. Do not guess a ceremony file."
            exit 1
          fi
          for key in "${keys[@]}"; do
            echo "Checking $key against ${ptaus[0]}"
            npx snarkjs zkey verify --help >/dev/null 2>&1 || true
            circuit="${key%.zkey}.r1cs"
            if [ ! -f "$circuit" ]; then
              echo "::error::Missing matching circuit $circuit for $key"
              exit 1
            fi
            npx snarkjs zkey verify "$circuit" "${ptaus[0]}" "$key"
          done
