name: Echo Protocol Z security gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts
      - name: Quarantine incompatible legacy V3 signal layout
        run: node scripts/check-v3-legacy-quarantine.js
      - name: Check legacy Groth16 verifier ABI shape
        run: node scripts/check-v3-verifier-abi.js
      - name: Enforce V3 public signal ordering compatibility
        run: node scripts/check-v3-public-signal-order.js EchoAuthorizationVerifierV3Aligned.circom
      - name: Guard signed checkpoint binding source invariants
        run: node scripts/check-checkpoint-binding-source.js
      - name: Compile aligned V3 circuit candidate
        run: |
          mkdir -p build/v3-aligned
          npx circom2 EchoAuthorizationVerifierV3Aligned.circom --r1cs --wasm --sym -l node_modules -o build/v3-aligned
          test -s build/v3-aligned/EchoAuthorizationVerifierV3Aligned.r1cs
          node scripts/test-v3-aligned-public-signals.js
          node scripts/test-v3-aligned-math-boundaries.js
          node scripts/check-v3-aligned-r1cs-witness.js
          node scripts/report-v3-aligned-artifacts.js
      - name: Upload candidate V3 circuit manifest
        uses: actions/upload-artifact@v4
        with:
          name: v3-aligned-build-manifest
          path: build/v3-aligned/artifact-manifest.json
          if-no-files-found: error
      - name: Compile from clean checkout
        run: npx hardhat compile
      - name: Run Hardhat regression suite
        run: npx hardhat test
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
  security-gate-summary:
    name: CI health (not production approval)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - clean-build-and-tests
      - independent-hardhat-regressions
      - independent-dependency-audit
      - bound-circuit-compile
    steps:
      - name: Summarize independently executed gates
        env:
          GATE_BUILD: ${{ needs.clean-build-and-tests.result }}
          GATE_HARDHAT: ${{ needs.independent-hardhat-regressions.result }}
          GATE_AUDIT: ${{ needs.independent-dependency-audit.result }}
          GATE_BOUND: ${{ needs.bound-circuit-compile.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Echo Protocol Z security gate results"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Clean build and circuit checks | $GATE_BUILD |"
            echo "| Independent Hardhat suite | $GATE_HARDHAT |"
            echo "| Dependency audit | $GATE_AUDIT |"
            echo "| Bound checkpoint circuit | $GATE_BOUND |"
            echo
            echo "NOT RELEASE APPROVAL: Groth16 setup/key verification and independent audit are outstanding."
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$GATE_BUILD" "$GATE_HARDHAT" "$GATE_AUDIT" "$GATE_BOUND"; do
            if [ "$result" != "success" ]; then
              echo "::error::Security release gate blocked: one or more required jobs are not successful."
              exit 1
            fi
          done
          echo "CI checks passed; production remains blocked pending Groth16 integrity and independent audit."
  independent-hardhat-regressions:
    # Runs regardless of failures in circuit compatibility or proving-key jobs.
    # A failed proof gate must not hide Solidity regression test results.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Compile contracts
        run: npx hardhat compile
      - name: Run full Hardhat regression suite
        run: npx hardhat test
  independent-dependency-audit:
    # Separate audit result even if proof compilation or Hardhat tests fail.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
  bound-circuit-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile hardened checkpoint-bound circuit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bound
          npx circom2 SpatiotemporalFragmentVerifierBound.circom --r1cs --wasm --sym -l node_modules -o build/bound
          test -s build/bound/SpatiotemporalFragmentVerifierBound.r1cs
          test -s build/bound/SpatiotemporalFragmentVerifierBound_js/SpatiotemporalFragmentVerifierBound.wasm
      - name: Run adversarial checkpoint witness regressions
        run: node scripts/test-bound-checkpoint-witness.js
      - name: Report circuit constraint count
        run: npx snarkjs r1cs info build/bound/SpatiotemporalFragmentVerifierBound.r1cs
